<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Доедешь до финиша?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --paper:#fff7ea; --ink:#3a1d4a; --pop:#ff3d6e; --gold:#ffc857; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #3f9d4f; font-family: "Nunito", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #game { touch-action: none; }
  #fx { pointer-events: none; z-index: 20; }

  /* верхняя панель: прогресс и подарки */
  .hud { position: fixed; top: 14px; left: 14px; right: 14px; z-index: 5; display: flex; gap: 12px; align-items: center; pointer-events: none; opacity: 0; transition: opacity .4s; }
  body.playing .hud { opacity: 1; }
  .bar { position: relative; flex: 1; height: 12px; border-radius: 99px; background: rgba(0,0,0,.3); }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 99px; background: var(--gold); }
  .bar .car { position: absolute; top: -11px; left: 0; font-size: 22px; display: inline-block; transform: translateX(-50%) scaleX(-1); }
  .bar .flag { position: absolute; top: -13px; right: -6px; font-size: 22px; }
  .gifts { color: #fff; font-weight: 800; font-size: 20px; background: rgba(0,0,0,.3); padding: 4px 12px; border-radius: 99px; }

  /* стартовое окно и окно с поздравлением */
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(43,16,85,.65); transition: opacity .4s; padding: 14px; overflow-y: auto; }
  .overlay.hide { opacity: 0; pointer-events: none; }
  .panel { background: var(--paper); color: var(--ink); border-radius: 18px; padding: 22px 20px; text-align: center; width: min(90vw, 380px); max-height: 94vh;
           display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 22px 40px rgba(0,0,0,.4);
           border: 3px dashed #f2b8a2; outline: 8px solid var(--paper); outline-offset: -12px; }
  .panel h2 { font-family: "Caveat", cursive; font-size: 40px; line-height: 1; color: var(--pop); }
  .panel p { font-size: 16px; line-height: 1.4; max-width: 28ch; }
  .btn { background: var(--pop); color: #fff; border: 0; border-radius: 99px; padding: 12px 28px; font: 800 17px "Nunito", sans-serif; cursor: pointer; box-shadow: 0 5px 0 #c42a52; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c42a52; }

  #card .panel { transform: rotate(-3deg) scale(.5); opacity: 0; }
  #card.show .panel { animation: pop .8s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes pop { to { transform: rotate(-1deg) scale(1); opacity: 1; } }
  #card .small { font-family: "Caveat", cursive; font-size: 24px; color: var(--pop); }
  #card h1 { 
  font-family: "Caveat", cursive; 
  font-weight: 700; 
  font-size: clamp(32px, 8.5vw, 44px); 
  line-height: 1.15; 
  padding: 0 14px; 
  background: linear-gradient(90deg, #ff3d6e, #ff9a3d, #b24dff); 
  -webkit-background-clip: text; 
  background-clip: text; 
  color: transparent; 

  }

  #card .sign { font-family: "Caveat", cursive; font-size: 26px; color: var(--pop); }
  #card .score { font-size: 14px; opacity: .75; font-weight: 700; }
  .btn.ghost { background: transparent; color: var(--ink); border: 2px solid #d9b9a8; box-shadow: none; padding: 7px 20px; font-size: 14px; }

  /* Рамка и парение картинки открытки */
  .gift-art-box {
    position: relative;
    width: min(74vw, 250px);
    border-radius: 14px;
    padding: 5px;
    background: linear-gradient(135deg, #ff3d6e, #ffc857, #ff3d6e);
    box-shadow: 0 10px 24px rgba(255, 61, 110, 0.4);
    animation: floatArt 3s ease-in-out infinite alternate;
  }
  @keyframes floatArt {
    0% { transform: translateY(0px) rotate(-1deg); }
    100% { transform: translateY(-6px) rotate(1.5deg); }
  }
  .gift-art-box img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
  }
</style>
</head>
<body>

  <canvas id="game"></canvas>
  <canvas id="fx"></canvas>

  <div class="hud">
    <div class="bar"><i id="prog"></i><span class="car" id="carIcon" style="display:inline-block; transform:translateX(-50%) scaleX(-1);">🏎️</span><span class="flag">🏁</span></div>
    <div class="gifts">🎁 <span id="giftCount">0</span></div>
  </div>

  <!-- старт -->
  <div class="overlay" id="start">
    <div class="panel">
      <h2>Доедешь до финиша?</h2>
      <p>Рули пальцем: держи левую или правую часть экрана. Собирай 🎁, объезжай конусы.</p>
      <button class="btn" id="go">Поехали!</button>
    </div>
  </div>

  <!-- поздравление -->
  <div class="overlay hide" id="card">
    <div class="panel">
      <div class="small">ты доехала до финиша!</div>
      
      <!-- Картинка-открытка -->
      <div class="gift-art-box">
        <img src="card.jpg" alt="Открытка для Ани">
      </div>

      <h1>С днём рождения, Аня!</h1>
      <p>Ну шо, чемпионка, поздравляю тебя с 18-ти летием!!!)</p>
      <div class="score" id="score"></div>
      <div class="sign">— от Андрушки</div>
      <button class="btn ghost" id="again">проехать ещё раз</button>
    </div>
  </div>

<script>
/* ====== настройки ====== */
const TOTAL = 9500;        // длина дороги
const SPEED = 380;         // крейсерская скорость
const CAR_COLOR = '#ff3d6e';

/* ====== сбалансированная физика ====== */
const ACCEL = 240;
const DRAG = 600;
const FINISH_BRAKE = 260;
const STEER = 1100;        // сбалансированная чувствительность руля
const LAT_DAMP = 5.0;      // демпфирование заноса
const MAX_VX = 275;        // лимит боковой скорости
const GRASS_SLOW = 0.5;
const STEP = 1 / 120;

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}

const cv = document.getElementById('game'), g = cv.getContext('2d');
const fx = document.getElementById('fx'),   f = fx.getContext('2d');
let W, H, dpr, roadW, roadL, carW, carH, carY, tile, treeSprites = [];
const TILE = 256;

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  fx.width = W; fx.height = H;
  roadW = Math.min(W * 0.74, 400);
  roadL = Math.round((W - roadW) / 2);
  carW = Math.max(34, roadW * 0.14); carH = carW * 1.8;
  carY = Math.round(H * 0.76);
  buildSprites();
}

function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function buildSprites() {
  const rnd = mulberry(7);
  tile = document.createElement('canvas'); tile.width = tile.height = TILE * dpr;
  const t = tile.getContext('2d'); t.scale(dpr, dpr);
  t.fillStyle = '#459f58'; t.fillRect(0, 0, TILE, TILE);
  for (let i = 0; i < 140; i++) {
    const x = rnd() * TILE, y = rnd() * TILE, r = 6 + rnd() * 16;
    t.fillStyle = rnd() < .5 ? 'rgba(255,255,255,.035)' : 'rgba(0,40,0,.045)';
    for (const dx of [-TILE, 0, TILE]) for (const dy of [-TILE, 0, TILE]) {
      t.beginPath(); t.ellipse(x + dx, y + dy, r, r * .7, rnd() * 3, 0, 6.3); t.fill();
    }
  }
  for (let i = 0; i < 260; i++) {
    const x = rnd() * TILE, y = rnd() * TILE;
    t.strokeStyle = rnd() < .5 ? 'rgba(30,110,50,.35)' : 'rgba(120,200,120,.3)'; t.lineWidth = 1.2;
    for (const dx of [-TILE, 0, TILE]) for (const dy of [-TILE, 0, TILE]) {
      t.beginPath(); t.moveTo(x + dx, y + dy); t.lineTo(x + dx + (rnd() - .5) * 3, y + dy - 3 - rnd() * 3); t.stroke();
    }
  }
  treeSprites = [15, 19, 24].map((r, k) => {
    const s = Math.ceil(r * 2 + 16), c = document.createElement('canvas');
    c.width = c.height = s * dpr; c.s = s;
    const x = c.getContext('2d'); x.scale(dpr, dpr); const m = s / 2;
    x.fillStyle = 'rgba(0,0,0,.22)'; x.beginPath(); x.ellipse(m + 4, m + 6, r, r * .9, 0, 0, 6.3); x.fill();
    x.fillStyle = '#1e6a35'; x.beginPath(); x.arc(m, m, r, 0, 6.3); x.fill();
    x.fillStyle = '#2a8a47'; x.beginPath(); x.arc(m - r * .15, m - r * .15, r * .72, 0, 6.3); x.fill();
    x.fillStyle = '#3fa65d'; x.beginPath(); x.arc(m - r * .3, m - r * .3, r * .38, 0, 6.3); x.fill();
    return c;
  });
}

let state = 'ready';
let dist, v, cxo, vx, yaw, shakeT, gifts, objs, deco;
let pDist, pX, pYaw;
let steer = 0, simTime = 0;
const keys = {};
const clamp = (a, lo, hi) => Math.max(lo, Math.min(hi, a));

function reset() {
  dist = 0; v = 0; cxo = 0; vx = 0; yaw = 0; shakeT = 0; gifts = 0; simTime = 0;
  pDist = dist; pX = cxo; pYaw = yaw;
  document.getElementById('giftCount').textContent = 0;
  const rnd = mulberry((Math.random() * 1e9) | 0);
  objs = [];
  for (let wy = 1000; wy < TOTAL - 700; wy += 240 + rnd() * 140) {
    objs.push({ wy, xr: 0.12 + rnd() * 0.76, dx: 0, type: rnd() < 0.55 ? 'gift' : 'cone',
                hit: false, vx: 0, vwy: 0, rot: 0, spin: 0, age: 0 });
  }
  deco = [];
  for (let wy = 0; wy < TOTAL + 600; wy += 110) {
    deco.push({ k: 'tree', wy: wy + rnd() * 50, left: rnd() < .5, off: rnd(), s: (rnd() * 3) | 0 });
    deco.push({ k: 'tree', wy: wy + 55 + rnd() * 50, left: rnd() < .5, off: rnd(), s: (rnd() * 3) | 0 });
    deco.push({ k: 'flower', wy: wy + rnd() * 110, left: rnd() < .5, off: rnd(), c: ['#fff', '#ffe066', '#ff9ec7'][(rnd() * 3) | 0] });
  }
}

/* Управление */
cv.addEventListener('pointerdown', e => { steer = e.clientX < W / 2 ? -1 : 1; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') steer = e.clientX < W / 2 ? -1 : 1; });
cv.addEventListener('pointerup',     () => steer = 0);
cv.addEventListener('pointercancel', () => steer = 0);
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; });
function steerInput() {
  let s = steer;
  if (keys['arrowleft'] || keys['a'] || keys['ф']) s = -1;
  if (keys['arrowright'] || keys['d'] || keys['в']) s = 1;
  return s;
}

function update(dt) {
  simTime += dt;
  const driving = state === 'play';

  const over = Math.abs(cxo) + carW / 2 - roadW / 2;
  const grass = clamp(over / (carW * 0.7), 0, 1);

  const target = driving ? SPEED * (1 - GRASS_SLOW * grass) : 0;
  const rate = target > v ? ACCEL : (driving ? DRAG : FINISH_BRAKE);
  v += clamp(target - v, -rate * dt, rate * dt);

  const authority = clamp(v / 140, 0, 1);
  const s = driving ? steerInput() : 0;
  vx += s * STEER * authority * dt;
  vx *= Math.exp(-(LAT_DAMP + 5 * grass) * dt);
  vx = clamp(vx, -MAX_VX, MAX_VX);
  cxo += vx * dt;

  const lim = W / 2 - carW / 2 - 4;
  if (Math.abs(cxo) > lim) { cxo = Math.sign(cxo) * lim; vx *= -0.25; }

  const yawTarget = clamp(vx / Math.max(v, 120) * 0.8, -0.35, 0.35);
  yaw += (yawTarget - yaw) * Math.min(1, dt * 10);

  dist += v * dt;
  if (shakeT > 0) shakeT -= dt;

  const cxs = W / 2 + cxo, br = carW * 0.45;
  const body = [carY - carH * 0.28, carY, carY + carH * 0.28];
  for (const o of objs) {
    if (o.type === 'cone' && o.hit) {
      o.age += dt; const k = Math.exp(-1.6 * dt);
      o.dx += o.vx * dt; o.wy += o.vwy * dt; o.vx *= k; o.vwy *= k; o.rot += o.spin * dt; o.spin *= k;
      continue;
    }
    if (o.hit) continue;
    const sy = carY - (o.wy - dist);
    if (sy < carY - 140 || sy > carY + 140) continue;
    const ox = roadL + o.xr * roadW + o.dx;
    const r = o.type === 'gift' ? 18 : 11;
    let touch = false;
    for (const by of body) { if (Math.hypot(ox - cxs, sy - by) < br + r) { touch = true; break; } }
    if (!touch) continue;
    o.hit = true;
    if (o.type === 'gift') {
      gifts++; document.getElementById('giftCount').textContent = gifts;
      burstAt(ox, sy, 22, 6, 2);
    } else {
      const dir = (ox - cxs) >= 0 ? 1 : -1;
      o.vx = dir * (140 + Math.random() * 80) + vx * 0.4;
      o.vwy = v * 1.15 + 80; o.spin = dir * (6 + Math.random() * 4);
      v *= 0.62;
      vx -= dir * 70; shakeT = 0.3;
    }
  }

  if (state === 'play' && dist >= TOTAL) state = 'finishing';
  if (state === 'finishing' && v < 4) finish();
}

function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); }

function drawCar(x, y, tilt) {
  g.save(); g.translate(x, y); g.rotate(tilt);
  const w = carW, h = carH;
  g.fillStyle = 'rgba(0,0,0,.28)'; rr(-w / 2 + 3, -h / 2 + 6, w, h, w * .3);
  g.fillStyle = '#1b1b1b';
  rr(-w / 2 - 4, -h * .34, 7, h * .2, 2); rr(w / 2 - 3, -h * .34, 7, h * .2, 2);
  rr(-w / 2 - 4,  h * .14, 7, h * .2, 2); rr(w / 2 - 3,  h * .14, 7, h * .2, 2);
  g.fillStyle = CAR_COLOR; rr(-w / 2, -h / 2, w, h, w * .3);
  g.fillStyle = '#ffc857'; rr(-w * .07, -h / 2 + 3, w * .14, h - 6, 2);
  g.fillStyle = '#2b1055'; rr(-w * .36, -h * .2, w * .72, h * .16, 4); rr(-w * .36, h * .08, w * .72, h * .12, 4);
  g.fillStyle = '#fff3b0'; rr(-w * .4, -h / 2 + 2, w * .2, 5, 2); rr(w * .2, -h / 2 + 2, w * .2, 5, 2);
  g.restore();
}

function drawCone(x, y, o) {
  g.save(); g.translate(x, y); g.rotate(o.rot);
  if (o.hit) g.globalAlpha = clamp(1 - (o.age - 0.9) / 0.6, 0, 1);
  g.fillStyle = 'rgba(0,0,0,.2)'; g.beginPath(); g.ellipse(3, 5, 13, 9, 0, 0, 6.3); g.fill();
  g.fillStyle = '#ff7a1a'; g.beginPath(); g.moveTo(0, -18); g.lineTo(12, 12); g.lineTo(-12, 12); g.closePath(); g.fill();
  g.fillStyle = '#fff'; g.fillRect(-7, -2, 14, 5);
  g.fillStyle = '#e65f00'; g.fillRect(-14, 10, 28, 5);
  g.restore();
}

function drawGift(x, y) {
  g.save(); g.translate(x, y + Math.sin(simTime * 4) * 3);
  g.font = '34px "Segoe UI Emoji", "Apple Color Emoji", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('🎁', 0, 0); g.restore();
}

function render(alpha) {
  const d = pDist + (dist - pDist) * alpha;
  const cx = W / 2 + pX + (cxo - pX) * alpha;
  const ya = pYaw + (yaw - pYaw) * alpha;

  g.fillStyle = '#459f58'; g.fillRect(0, 0, W, H);
  const oy = Math.round(d) % TILE;
  for (let y = oy - TILE; y < H; y += TILE) for (let x = 0; x < W; x += TILE) g.drawImage(tile, x, y, TILE, TILE);

  for (const o of deco) {
    const sy = Math.round(carY - (o.wy - d));
    if (sy < -40 || sy > H + 40) continue;
    const m = roadL * (0.18 + 0.64 * o.off);
    const sx = Math.round(o.left ? m : W - m);
    if (o.k === 'flower') {
      g.fillStyle = o.c;
      g.fillRect(sx, sy, 3, 3); g.fillRect(sx + 6, sy + 3, 3, 3); g.fillRect(sx - 4, sy + 5, 3, 3);
    } else {
      const sp = treeSprites[o.s];
      g.drawImage(sp, sx - sp.s / 2, sy - sp.s / 2, sp.s, sp.s);
    }
  }

  g.fillStyle = '#b9a98a'; g.fillRect(roadL - 9, 0, roadW + 18, H);
  g.fillStyle = '#4b4b5a'; g.fillRect(roadL, 0, roadW, H);
  g.fillStyle = '#f4f4f4'; g.fillRect(roadL + 3, 0, 4, H); g.fillRect(roadL + roadW - 7, 0, 4, H);
  g.fillStyle = 'rgba(255,255,255,.8)';
  const off = Math.round(d) % 90;
  for (let y = off - 90; y < H; y += 90) g.fillRect(Math.round(W / 2) - 3, y, 6, 44);

  const fy = Math.round(carY - (TOTAL - d));
  if (fy > -80 && fy < H + 80) {
    const n = 14, cs = Math.floor(roadW / n), x0 = Math.round(W / 2 - cs * n / 2);
    for (let r = 0; r < 2; r++) for (let c = 0; c < n; c++) {
      g.fillStyle = (r + c) % 2 ? '#fff' : '#111';
      g.fillRect(x0 + c * cs, fy - cs + r * cs, cs, cs);
    }
    g.fillStyle = '#fff'; g.font = '800 26px Nunito, sans-serif'; g.textAlign = 'center';
    g.fillText('ФИНИШ', W / 2, fy - cs - 14);
  }

  for (const o of objs) {
    const sy = carY - (o.wy - d);
    if (sy < -50 || sy > H + 50) continue;
    const sx = roadL + o.xr * roadW + o.dx;
    if (o.type === 'gift') { if (!o.hit) drawGift(sx, sy); }
    else if (!o.hit || o.age < 1.5) drawCone(sx, sy, o);
  }

  const grass = clamp((Math.abs(cxo) + carW / 2 - roadW / 2) / (carW * 0.7), 0, 1);
  const buzz = (shakeT > 0 ? 3 * shakeT / 0.3 : 0) + grass * 1.2;
  drawCar(cx + Math.sin(simTime * 90) * buzz, carY + Math.cos(simTime * 77) * buzz * 0.6, ya);

  const p = clamp(d / TOTAL, 0, 1) * 100;
  document.getElementById('prog').style.width = p + '%';
  document.getElementById('carIcon').style.left = p + '%';
}

/* ====== конфетти ====== */
let parts = [];
const colors = ['#ff3d6e', '#ffc857', '#4ecdc4', '#b24dff', '#ffffff', '#ff9a3d'];
function burstAt(x, y, n, spread, up) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = 3 + Math.random() * spread;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - up, size: 6 + Math.random() * 8,
      c: Math.random() < .3, col: colors[(Math.random() * colors.length) | 0],
      rot: Math.random() * 6, vr: (Math.random() - .5) * .4, wob: Math.random() * 6, life: 1 });
  }
}
function rain(n) {
  for (let i = 0; i < n; i++) {
    parts.push({ x: Math.random() * W, y: -20, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3,
      size: 6 + Math.random() * 7, c: Math.random() < .3, col: colors[(Math.random() * colors.length) | 0],
      rot: Math.random() * 6, vr: (Math.random() - .5) * .3, wob: Math.random() * 6, life: 1.2 });
  }
}
function drawParts(k) {
  f.clearRect(0, 0, W, H);
  for (const p of parts) {
    p.vy += 0.22 * k; p.vx *= Math.pow(0.985, k); p.vy *= Math.pow(0.995, k); p.wob += 0.1 * k;
    p.x += (p.vx + Math.sin(p.wob) * 0.6) * k; p.y += p.vy * k; p.rot += p.vr * k; p.life -= 0.003 * k;
    f.save(); f.globalAlpha = clamp(p.life, 0, 1);
    f.translate(p.x, p.y); f.rotate(p.rot); f.fillStyle = p.col;
    if (p.c) { f.beginPath(); f.arc(0, 0, p.size / 2.5, 0, 6.3); f.fill(); }
    else f.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 4 * 2);
    f.restore();
  }
  parts = parts.filter(p => p.life > 0 && p.y < H + 30);
}

let last = performance.now(), acc = 0;
function loop(now) {
  const frame = Math.min((now - last) / 1000, 0.1); last = now;
  if (state === 'play' || state === 'finishing') {
    acc += frame;
    while (acc >= STEP) {
      pDist = dist; pX = cxo; pYaw = yaw;
      update(STEP);
      acc -= STEP;
    }
  } else { acc = 0; pDist = dist; pX = cxo; pYaw = yaw; }
  render(acc / STEP);
  drawParts(frame * 60);
  requestAnimationFrame(loop);
}

function startGame() {
  reset(); state = 'play';
  document.body.classList.add('playing');
  document.getElementById('start').classList.add('hide');
  document.getElementById('card').classList.add('hide');
  document.getElementById('card').classList.remove('show');
}
function finish() {
  if (state === 'done') return;
  state = 'done';
  document.body.classList.remove('playing');
  document.getElementById('score').textContent = gifts ? 'по дороге собрано подарков: ' + gifts + ' 🎁' : '';
  const card = document.getElementById('card');
  card.classList.remove('hide'); card.classList.add('show');
  burstAt(W / 2, H / 2, 180, 12, 5);
  setTimeout(() => burstAt(W / 2, H / 2, 100, 9, 4), 450);
  setTimeout(() => rain(110), 900);
}
document.getElementById('go').addEventListener('click', startGame);
document.getElementById('again').addEventListener('click', startGame);

resize(); addEventListener('resize', resize);
reset();
requestAnimationFrame(loop);
window.addEventListener('contextmenu', e => e.preventDefault());
</script>
